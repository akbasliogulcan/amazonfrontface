<!DOCTYPE html>
<html lang="en">

<head>
           <meta charset="UTF-8">
           <meta name="viewport" content="width=device-width, initial-scale=1.0">
           <title>Amazon</title>
           <link rel="stylesheet" href="style.css">
           <link rel="shortcut icon" href="./assets/images/favicon.png">
           <!-- Bs İcons Link -->
           <link rel="stylesheet"
                      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>

<body>
           <!--Header  -->
           <header>

                      <!-- Logo   -->
                      <div class="nav-logo">
                                 <img src="./assets/images/amazon_logo.png" alt="Logo">
                      </div>
                      <!-- Address -->
                      <div class="nav-adress">
                                 <div class="add-first">Deliver to</div>
                                 <div class="add-icon">
                                            <i class="bi bi-geo-alt"></i>
                                            <span>Türkiye</span>
                                 </div>
                      </div>
                      <!-- Search -->
                      <div class="nav-search">
                                 <!-- Select -->
                                 <select>
                                            <option selected disabled>Seçiniz</option>
                                            <option>Hepsi</option>
                                            <option>Elektronik</option>
                                            <option> Ev</option>
                                 </select>
                                 <!-- İnput-->
                                 <input type="search" class="search-input" placeholder="Ara">
                                 <!-- Button -->
                                 <button class="search-icon">
                                            <i class="bi bi-search"></i> </button>
                      </div>
                      <!-- nav-siging -->
                      <div class="nav-singin">
                                 <p> <span>Merhaba,Giriş Yapınız</span>
                                 </p>
                                 <p class="nav-second">Hesap ve listeler
                                 </p>
                      </div>
                      <!-- nav-siging -->
                      <div class="nav-singin">
                                 <p> <span>Merhaba</span>
                                 </p>
                                 <p class="nav-second">Kategoriler
                                 </p>
                      </div>

                      <!-- nav-siging -->
                      <div class="nav-singin">
                                 <p> <span>İadeler</span>
                                 </p>
                                 <p class="nav-second">ve siparişler
                                 </p>
                      </div>
                      <!-- Sepet -->
                      <div class="nav-cart">
                                 <i class="bi bi-cart"></i>Sepet
                      </div>



           </header>
</body>

</html>
